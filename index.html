<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>猫币 · 呆瓜咪</title>
<style>
:root{
  --bg:#fff8ef;--card:#fff;--text:#342820;--muted:#9a8c81;
  --orange:#ff9f1c;--red:#ff6655;--line:#efe2d6;
}
*{box-sizing:border-box}
body{
  margin:0;background:linear-gradient(180deg,#fff8ef,#fffdfa);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
.app{width:min(100%,520px);margin:0 auto;padding:18px 16px 38px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.title{font-size:19px;font-weight:850}
.hero{
  background:#fff;border-radius:28px;overflow:hidden;
  box-shadow:0 12px 34px rgba(76,53,34,.08);
  border:1px solid rgba(255,159,28,.12)
}
.bubble{
  width:max-content;max-width:85%;margin:14px auto 0;padding:9px 13px;
  border-radius:16px;background:#fff9f2;border:1px solid #f3e2d3;font-size:13px
}
.catStage{
  width:100%;height:320px;display:grid;place-items:center;position:relative;
  border:0;padding:12px;background:radial-gradient(circle at 50% 74%,#ffe9c8 0,#fff7eb 43%,#fff 76%);
  cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent
}
.catStage::after{
  content:"";position:absolute;width:48%;height:22px;left:26%;bottom:18px;
  border-radius:50%;background:rgba(105,67,39,.13);filter:blur(8px)
}
.catImage{
  width:100%;height:100%;object-fit:contain;position:relative;z-index:1;
  filter:drop-shadow(0 10px 10px rgba(112,67,32,.12));user-select:none;-webkit-user-drag:none
}
.catImage.happy{animation:catHappy .85s cubic-bezier(.2,.8,.25,1)}
.catImage.sad{animation:catSad 1.05s ease}
.catImage.pet{animation:catPet .7s ease}
.catImage.grin{animation:catGrin 1s cubic-bezier(.2,.8,.25,1)}
.catImage.rewardSmall,.catImage.rewardBig{animation:catGrin 1s cubic-bezier(.2,.8,.25,1)}
.catImage.attack{animation:catAttack .78s cubic-bezier(.2,.8,.25,1)}
.catCaption{
  position:absolute;z-index:3;left:50%;bottom:14px;transform:translateX(-50%) translateY(8px);
  width:max-content;max-width:88%;padding:7px 13px;border-radius:999px;
  background:rgba(55,45,39,.88);color:#fff;font-size:17px;font-weight:900;
  letter-spacing:.5px;opacity:0;transition:.18s;pointer-events:none;
  text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:0 5px 15px rgba(70,45,28,.18)
}
.catCaption.show{opacity:1;transform:translateX(-50%) translateY(0)}
.catCaption.rewardSmall{
  bottom:22px;padding:9px 17px;font-size:22px;letter-spacing:1px;
  background:linear-gradient(135deg,#ff8a00,#ffb21c);color:#fff9df;
  box-shadow:0 8px 24px rgba(255,138,0,.38);
  animation:rewardWords 1.25s cubic-bezier(.18,.85,.24,1)
}
.catCaption.rewardBig{
  bottom:22px;padding:9px 17px;font-size:20px;background:#4a3730;
  animation:bigWords 1.25s cubic-bezier(.18,.85,.24,1)
}
.petHint{
  position:absolute;z-index:4;right:13px;bottom:13px;padding:7px 10px;border-radius:999px;
  background:rgba(255,255,255,.9);color:#8a6248;font-size:11px;font-weight:800;
  box-shadow:0 5px 15px rgba(70,45,28,.1);pointer-events:none
}
@keyframes catHappy{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-18px) rotate(-2deg)}}
@keyframes catSad{0%,100%{transform:translateY(0)}45%{transform:translateY(10px) scale(.98)}}
@keyframes catPet{0%,100%{transform:rotate(0) scale(1)}45%{transform:rotate(-3deg) scale(1.025)}}
@keyframes catGrin{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-12px) scale(1.035)}}
@keyframes catAttack{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-12px) rotate(-2deg) scale(1.06)}55%{transform:translateX(15px) rotate(3deg) scale(1.08)}75%{transform:translateX(-6px) rotate(-1deg) scale(1.04)}}
@keyframes rewardWords{
  0%{opacity:0;transform:translateX(-50%) translateY(24px) scale(.45) rotate(-7deg)}
  34%{opacity:1;transform:translateX(-50%) translateY(-8px) scale(1.18) rotate(3deg)}
  52%{transform:translateX(-50%) translateY(0) scale(.96) rotate(-2deg)}
  70%{transform:translateX(-50%) translateY(-3px) scale(1.06) rotate(1deg)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1) rotate(0)}
}
@keyframes bigWords{
  0%{opacity:0;transform:translateX(-50%) translateY(18px) scale(.7)}
  38%{opacity:1;transform:translateX(-50%) translateY(-5px) scale(1.1)}
  58%{transform:translateX(-50%) translateY(1px) scale(.98)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
}
.balanceCard{text-align:center;padding:12px 18px 18px}
.label{font-size:13px;color:var(--muted)}
.balance{font-size:50px;font-weight:900;letter-spacing:-2px}
.stats{font-size:12px;color:var(--muted);margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.btn{
  min-height:68px;border:0;border-radius:20px;font-size:18px;font-weight:850;color:#fff
}
.add{background:linear-gradient(135deg,#ffad27,#ff9418)}
.sub{background:linear-gradient(135deg,#ff7667,#ff5b49)}
.withdraw{grid-column:1/-1;background:linear-gradient(135deg,#9a7155,#74503a)}
.share{grid-column:1/-1;background:linear-gradient(135deg,#56a7ff,#3577e5)}
.panel{
  margin-top:16px;background:#fff;border-radius:24px;padding:17px;
  box-shadow:0 10px 28px rgba(89,60,38,.06)
}
.panel h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cardbtn{
  border:1px solid var(--line);background:#fffaf5;border-radius:18px;
  padding:13px;text-align:left
}
.cardbtn:disabled,.btn:disabled{opacity:.5;cursor:wait}
.cardbtn b{display:block;margin-top:4px;font-size:14px}
.cardbtn span{display:block;margin-top:3px;font-size:12px;color:#e98516;font-weight:800}
.cardbtn.neg span{color:#d95c51}
.hidden{display:none}
.history .row{
  display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line)
}
.history .row:last-child{border-bottom:0}
.icon{width:38px;height:38px;border-radius:12px;background:#fff7ee;display:grid;place-items:center}
.name{font-size:14px;font-weight:700}
.time{font-size:11px;color:var(--muted);margin-top:2px}
.val{font-weight:850}.plus{color:#e98716}.minus{color:#d95c51}
.overlay{
  display:none;position:fixed;inset:0;background:rgba(46,33,25,.32);
  padding:18px;align-items:flex-end;justify-content:center;z-index:50
}
.overlay.show{display:flex}
.sheet{
  width:min(100%,500px);background:#fff;border-radius:28px 28px 18px 18px;padding:20px
}
.sheet h2{margin:0;font-size:19px}
.sheet p{font-size:13px;color:var(--muted)}
.confirmValue{text-align:center;font-size:34px;font-weight:900;color:#d95c51;margin:14px 0}
.confirmActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirmActions button{padding:14px;border:0;border-radius:16px;font-weight:850}
.cancel{background:#f4f0ec;color:#62554c}.danger{background:#ff6755;color:#fff}
.withdrawInput{
  width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;
  font:inherit;font-size:18px;font-weight:800;outline:none
}
.withdrawInput:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,159,28,.12)}
.food{background:#8a6248;color:#fff}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(18px);
  background:#372d27;color:white;padding:10px 15px;border-radius:999px;
  opacity:0;transition:.2s;z-index:70
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">🐾 猫币</div>
    <div style="font-size:12px;color:#9a8c81">呆瓜咪陪你记录</div>
  </div>

  <section class="hero">
    <div class="bubble" id="bubble">摸摸呆瓜咪，今天也要开心攒猫币</div>
    <button class="catStage" id="catStage" aria-label="摸摸呆瓜咪">
      <img class="catImage" id="catImage" src="./assets/cat-idle.png" alt="名叫呆瓜咪的成熟橘猫" draggable="false">
      <span class="catCaption" id="catCaption"></span>
      <span class="petHint">👆 点我，摸摸呆瓜咪</span>
    </button>
    <div class="balanceCard">
      <div class="label">当前猫币</div>
      <div><span class="balance" id="balance">8</span> 🪙</div>
      <div class="stats">总获得：<span id="earned">8</span>　总消耗：<span id="spent">0</span></div>
    </div>
  </section>

  <div class="actions">
    <button class="btn add" id="addBtn">🪙 给猫币</button>
    <button class="btn sub" id="subBtn">😾 扣猫币</button>
    <button class="btn withdraw" id="withdrawBtn">🥫 换猫粮（提现）</button>
    <button class="btn share" id="shareBtn">🐾 分享呆瓜咪的求投喂链接</button>
  </div>

  <section class="panel" id="rewardPanel">
    <h3>⭐ 快速奖励</h3>
    <div class="grid" id="rewards"></div>
  </section>

  <section class="panel hidden" id="reasonPanel">
    <h3>为什么要扣猫币？</h3>
    <div class="grid" id="reasons"></div>
  </section>

  <section class="panel history">
    <h3>🐾 猫币记录</h3>
    <div id="history"></div>
  </section>

  <div class="note" id="syncStatus">正在连接云端咪币……</div>
</div>

<div class="overlay" id="confirm">
  <div class="sheet">
    <h2>真的要扣猫币吗？</h2>
    <p id="confirmReason"></p>
    <div class="confirmValue" id="confirmValue">-5 🪙</div>
    <div class="confirmActions">
      <button class="cancel" id="cancel">再想想</button>
      <button class="danger" id="ok">确认扣除</button>
    </div>
  </div>
</div>
<div class="overlay" id="giftConfirm">
  <div class="sheet">
    <h2>🎁 来给呆瓜咪送咪币</h2>
    <p>呆瓜咪正在努力攒猫粮。朋友请你来送一枚咪币，点一下就好，不用登录。</p>
    <div class="confirmValue" style="color:#e98716">+1 🪙</div>
    <div class="confirmActions">
      <button class="cancel" id="giftCancel">下次再送</button>
      <button class="food" id="giftReward">送呆瓜咪 +1</button>
    </div>
  </div>
</div>
<div class="overlay" id="petConfirm">
  <div class="sheet">
    <h2>😽 呆瓜咪被摸开心了</h2>
    <p id="petMessage">呼噜呼噜……要奖励呆瓜咪 1 咪币吗？</p>
    <div class="confirmValue" style="color:#e98716">+1 🪙</div>
    <div class="confirmActions">
      <button class="cancel" id="petCancel">这次不加</button>
      <button class="food" id="petReward">奖励 +1</button>
    </div>
  </div>
</div>
<div class="overlay" id="withdrawConfirm">
  <div class="sheet">
    <h2>🥫 换猫粮（提现）</h2>
    <p>输入要兑换的咪币数量，最多可换 <span id="withdrawMax">8</span> 个。</p>
    <input class="withdrawInput" id="withdrawAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="输入咪币数量">
    <div class="confirmActions" style="margin-top:14px">
      <button class="cancel" id="withdrawCancel">先不换</button>
      <button class="food" id="withdrawOk">确认提现</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const rewards=[
  {id:"reward-happy",emoji:"😸",name:"今天很开心",value:1},
  {id:"reward-great",emoji:"🌟",name:"表现超棒",value:2},
  {id:"reward-kind",emoji:"🫶",name:"贴心时刻",value:5},
  {id:"reward-special",emoji:"🎉",name:"特别开心",value:10}
];
const reasons=[
  {id:"deduct-angry",emoji:"😿",name:"惹猫猫生气",value:-5},
  {id:"deduct-promise",emoji:"😾",name:"说话不算数",value:-5},
  {id:"deduct-mess",emoji:"🗑️",name:"乱丢东西",value:-3},
  {id:"deduct-naughty",emoji:"🙀",name:"不乖不听话",value:-3}
];
const API_URL="https://mibi-cloud-api.pages.dev";
let state={balance:8,earned:8,spent:0,history:[]};
let pending=null;
let busy=false;
let petPromptTimer=null;
const $=s=>document.querySelector(s);

function toast(t){
  const x=$("#toast");x.textContent=t;x.classList.add("show");
  clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove("show"),1400);
}
function render(){
  $("#balance").textContent=state.balance;
  $("#earned").textContent=state.earned;
  $("#spent").textContent=state.spent;
  const h=$("#history");
  h.innerHTML=state.history.length?state.history.slice().reverse().map(e=>`
    <div class="row">
      <div class="icon">${e.emoji}</div>
      <div><div class="name">${e.name}</div><div class="time">${new Date(e.time).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}</div></div>
      <div class="val ${e.value>0?"plus":"minus"}">${e.value>0?"+":""}${e.value}</div>
    </div>`).join(""):'<div style="color:#9a8c81;font-size:13px;padding:8px 0">还没有记录</div>';
}

function setBusy(value){
  busy=value;
  document.querySelectorAll(".cardbtn,.btn,#ok,#withdrawOk,#petReward,#giftReward").forEach(button=>button.disabled=value);
}
function applyCloudState(data){
  state={
    balance:Number(data.balance),earned:Number(data.earned),spent:Number(data.spent),
    history:Array.isArray(data.history)?data.history:[]
  };
  render();
}
async function callApi(path,options={}){
  const response=await fetch(API_URL+path,{
    ...options,
    headers:{"Content-Type":"application/json",...(options.headers||{})}
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||"云端服务暂时不可用");
  return data;
}
async function syncState(){
  setBusy(true);$("#syncStatus").textContent="正在同步云端咪币……";
  try{
    applyCloudState(await callApi("/api/state"));
    $("#syncStatus").textContent="已连接云端 · 所有人共享同一份咪币";
  }catch(error){
    $("#syncStatus").textContent="云端连接失败，请稍后刷新";toast(error.message);
  }finally{setBusy(false)}
}

/* ---------- IMAGE-BASED ORANGE CAT ---------- */
const catImage=$("#catImage");
const catSources={
  idle:"./assets/cat-idle.png",
  happy:"./assets/cat-happy.png",
  rewardSmall:"./assets/cat-reward-small.png",
  rewardBig:"./assets/cat-reward-big.png",
  sad:"./assets/cat-sad.png",
  attack:"./assets/cat-scratch.png"
};
Object.values(catSources).forEach(src=>{const img=new Image();img.src=src;});
const catCaption=$("#catCaption");
let catResetTimer=null;
function setMode(mode,caption=""){
  const visual=mode==="pet"?"happy":mode;
  clearTimeout(catResetTimer);
  catImage.className="catImage";
  void catImage.offsetWidth;
  catImage.src=catSources[visual];
  catImage.classList.add(mode==="pet"?"pet":visual);
  catCaption.textContent=caption;
  catCaption.className="catCaption";
  if(caption)catCaption.classList.add("show",mode);
  if(mode==="attack")catResetTimer=setTimeout(()=>setMode("sad"),850);
  else if(mode!=="idle")catResetTimer=setTimeout(()=>setMode("idle"),mode==="sad"?1500:1350);
}
const petReplies=[
  "呆瓜咪眯起眼睛：这里摸得刚刚好。",
  "呼噜呼噜……耳朵后面也要摸到。",
  "呆瓜咪把脑袋凑过来：再摸两下嘛。",
  "尾巴轻轻晃了晃，呆瓜咪看起来很满意。",
  "呆瓜咪用脑袋蹭了蹭你：手法不错。"
];
$("#catStage").addEventListener("click",()=>{
  if(busy||$("#petConfirm").classList.contains("show"))return;
  const reply=petReplies[Math.floor(Math.random()*petReplies.length)];
  $("#bubble").textContent=reply;
  setMode("pet");
  clearTimeout(petPromptTimer);
  petPromptTimer=setTimeout(()=>{
    $("#petMessage").textContent=reply+" 要奖励呆瓜咪 1 咪币吗？";
    $("#petConfirm").classList.add("show");
  },650);
});

async function addCoins(e){
  if(busy)return;
  const small=e.value<=2;
  const caption=small?"咪想要，咪得到":"塞牙缝都不够";
  $("#bubble").textContent=`${e.emoji} ${e.name}，奖励 ${e.value} 猫币！`;
  setMode(small?"rewardSmall":"rewardBig",caption);setBusy(true);
  try{
    applyCloudState(await callApi("/api/actions",{method:"POST",body:JSON.stringify({actionId:e.id})}));
    toast(`+${e.value} 猫币`);
  }catch(error){toast(error.message)}finally{setBusy(false)}
}
function confirmMinus(e){
  pending=e;$("#confirmReason").textContent="原因："+e.name;
  $("#confirmValue").textContent=e.value+" 🪙";$("#confirm").classList.add("show");
}
async function doMinus(){
  if(!pending||busy)return;
  const action=pending;pending=null;
  $("#bubble").textContent=`${action.emoji} ${action.name}，呆瓜咪炸毛挥爪了！`;
  setMode("attack");$("#confirm").classList.remove("show");setBusy(true);
  try{
    applyCloudState(await callApi("/api/actions",{method:"POST",body:JSON.stringify({actionId:action.id})}));
    toast(`${action.value} 猫币`);
  }catch(error){toast(error.message)}finally{setBusy(false)}
}
function openWithdraw(){
  if(busy)return;
  $("#withdrawMax").textContent=state.balance;
  $("#withdrawAmount").value="";
  $("#withdrawAmount").max=Math.max(state.balance,0);
  $("#withdrawConfirm").classList.add("show");
  setTimeout(()=>$("#withdrawAmount").focus(),80);
}
async function doWithdraw(){
  if(busy)return;
  const amount=Number($("#withdrawAmount").value);
  if(!Number.isInteger(amount)||amount<1){toast("请输入正确的咪币数量");return}
  if(amount>state.balance){toast("咪币余额不够换猫粮");return}
  $("#withdrawConfirm").classList.remove("show");setBusy(true);
  $("#bubble").textContent=`🥫 用 ${amount} 咪币换到猫粮啦！`;
  setMode("happy","开罐！");
  try{
    applyCloudState(await callApi("/api/actions",{method:"POST",body:JSON.stringify({actionId:"withdraw-food",amount})}));
    toast(`已提现 ${amount} 咪币`);
  }catch(error){toast(error.message)}finally{setBusy(false)}
}
function giftUrl(){
  const url=new URL(location.origin+location.pathname);
  url.searchParams.set("gift","1");
  return url.toString();
}
const SHARE_TEXT="呆瓜咪正在努力攒猫粮 🐾\n点开帮它送 1 枚咪币吧，只要一下！";
async function shareGift(){
  const url=giftUrl();
  const data={title:"给呆瓜咪送一枚咪币",text:SHARE_TEXT,url};
  const shareCopy=`${SHARE_TEXT}\n${url}`;
  try{
    if(navigator.share){await navigator.share(data);return}
    await navigator.clipboard.writeText(shareCopy);
    toast("求投喂文案和链接已复制");
  }catch(error){
    if(error.name!=="AbortError"){
      window.prompt("复制这段求投喂文案",shareCopy);
    }
  }
}
function closeGiftPrompt(){
  $("#giftConfirm").classList.remove("show");
  const url=new URL(location.href);url.searchParams.delete("gift");
  history.replaceState({},"",url.pathname+url.search+url.hash);
}
function openGiftFromLink(){
  if(new URLSearchParams(location.search).get("gift")==="1"){
    $("#giftConfirm").classList.add("show");
  }
}

rewards.forEach(e=>{
  const b=document.createElement("button");b.className="cardbtn";
  b.innerHTML=`${e.emoji}<b>${e.name}</b><span>+${e.value} 猫币</span>`;
  b.onclick=()=>addCoins(e);$("#rewards").appendChild(b);
});
reasons.forEach(e=>{
  const b=document.createElement("button");b.className="cardbtn neg";
  b.innerHTML=`${e.emoji}<b>${e.name}</b><span>${e.value} 猫币</span>`;
  b.onclick=()=>confirmMinus(e);$("#reasons").appendChild(b);
});

$("#addBtn").onclick=()=>{$("#rewardPanel").classList.remove("hidden");$("#reasonPanel").classList.add("hidden")};
$("#subBtn").onclick=()=>{$("#reasonPanel").classList.remove("hidden");$("#rewardPanel").classList.add("hidden")};
$("#withdrawBtn").onclick=openWithdraw;
$("#shareBtn").onclick=shareGift;
$("#giftCancel").onclick=closeGiftPrompt;
$("#giftReward").onclick=()=>{
  closeGiftPrompt();
  addCoins(rewards[0]);
};
$("#giftConfirm").onclick=e=>{if(e.target===$("#giftConfirm"))closeGiftPrompt()};
$("#petCancel").onclick=()=>$("#petConfirm").classList.remove("show");
$("#petReward").onclick=()=>{
  $("#petConfirm").classList.remove("show");
  addCoins(rewards[0]);
};
$("#petConfirm").onclick=e=>{if(e.target===$("#petConfirm"))$("#petConfirm").classList.remove("show")};
$("#cancel").onclick=()=>{pending=null;$("#confirm").classList.remove("show")};
$("#ok").onclick=doMinus;
$("#confirm").onclick=e=>{if(e.target===$("#confirm")){pending=null;$("#confirm").classList.remove("show")}};
$("#withdrawCancel").onclick=()=>$("#withdrawConfirm").classList.remove("show");
$("#withdrawOk").onclick=doWithdraw;
$("#withdrawAmount").addEventListener("keydown",e=>{if(e.key==="Enter")doWithdraw()});
$("#withdrawConfirm").onclick=e=>{if(e.target===$("#withdrawConfirm"))$("#withdrawConfirm").classList.remove("show")};
render();syncState();openGiftFromLink();
</script>
</body>
</html>
